AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap for nibrun. Creates the GitHub OIDC provider, the two roles
  GitHub Actions assumes to run Terraform — apply from main, plan from a pull
  request — and the S3 bucket holding Terraform state.
  Deploy this once in the AWS Console (CloudFormation > Create stack > upload this
  file). After it exists, everything else is managed by Terraform in CI.

Parameters:
  GitHubRepo:
    Type: String
    Default: ilbertt/nibrun
    Description: owner/repo allowed to assume the Terraform role.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to false if the account already has the GitHub OIDC provider — there
      can only be one per account, and a second stack creating it will fail.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: nibrun
        - Key: ManagedBy
          Value: cloudformation

  # Terraform's own state. Versioned so a corrupted or truncated state file is
  # recoverable, and retained on stack deletion so tearing down the bootstrap
  # never takes the record of every other resource with it.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # S3 names are global, so this has to be unique across every AWS account.
      BucketName: nibrun-infra-tfstate
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: nibrun
        - Key: ManagedBy
          Value: cloudformation

  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nibrun-terraform
      Description: Assumed by GitHub Actions to run Terraform for nibrun.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Two forms: GitHub emits owner and repo with their immutable
              # numeric ids on repositories where that is enabled, and the plain
              # names elsewhere. Matching both survives either.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub
                    - repo:${Owner}@*/${Name}@*:ref:refs/heads/main
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      # Broad for a first dev setup. Scope down later once the resource set is
      # stable (it only ever runs from your repo's main branch).
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: Project
          Value: nibrun
        - Key: ManagedBy
          Value: cloudformation

  # Terraform cannot own this: it is what CI assumes in order to run a plan, so
  # a fresh account could never plan before its first apply. Read-only, and its
  # policy references nothing Terraform manages.
  TerraformPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nibrun-terraform-plan
      Description: Assumed by GitHub Actions to plan Terraform on pull requests.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Pull requests from forks get no token at all, so this is branches
              # in this repository only. Also assumable from main, so a plan can
              # be run there without applying. Both subject forms, as above.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:pull_request
                  - !Sub
                    - repo:${Owner}@*/${Name}@*:pull_request
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub
                    - repo:${Owner}@*/${Name}@*:ref:refs/heads/main
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        # ReadOnlyAccess deliberately omits kms:Decrypt, without which
        # refreshing a SecureString parameter fails.
        - PolicyName: kms-decrypt-via-ssm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Project
          Value: nibrun
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  TerraformRoleArn:
    Description: Set this as the AWS_TERRAFORM_ROLE_ARN variable in the GitHub repo.
    Value: !GetAtt TerraformRole.Arn
  TerraformPlanRoleArn:
    Description: Set this as the AWS_PLAN_ROLE_ARN variable in the GitHub repo.
    Value: !GetAtt TerraformPlanRole.Arn
  StateBucket:
    Description: Must match the backend bucket in infra/terraform/versions.tf.
    Value: !Ref StateBucket
