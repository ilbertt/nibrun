name: Prepare
description: Prepare the environment for the workflow

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    # TODO: remove this step once bun v1.4 is out and update .bun-version
    - name: Bump bun to canary
      shell: bash
      run: bun upgrade --canary

    - name: Turbo Cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.workflow }}-${{ github.job }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
