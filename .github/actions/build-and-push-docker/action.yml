name: Build and push Docker image
description: Build an image and push it to the registry, skipping the build if that tag already exists.

inputs:
  image-repository:
    description: Target image repository, without a tag.
    required: true
  image-tag:
    description: Image tag to publish.
    required: true
  context:
    description: Docker build context.
    required: true
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  cache-scope:
    description: GitHub Actions cache scope; keep distinct per image to avoid collisions.
    required: true

outputs:
  image-uri:
    description: The immutable image reference to deploy.
    value: ${{ steps.build.outputs.image-uri }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Build and push image
      id: build
      shell: bash
      env:
        IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        BUILD_CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        CACHE_FROM: type=gha,scope=${{ inputs.cache-scope }}
        CACHE_TO: type=gha,mode=max,scope=${{ inputs.cache-scope }}
        SOURCE_LABEL: https://github.com/${{ github.repository }}
      run: bun run --filter @repo/internal-scripts build-and-push-image
