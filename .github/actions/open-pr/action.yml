name: Open a pull request
description: Commit the staged paths onto a branch and open a pull request for it.

inputs:
  branch:
    description: >-
      Branch to push the commit to. Also the change's identity — a branch whose
      pull request is open or merged is not proposed again. One whose pull
      request was closed unmerged is: closing it threw the proposal away, and
      running this again asks for it back.
    required: true
  title:
    description: Pull request title, also the commit message.
    required: true
  body:
    description: Pull request body, as Markdown.
    required: true
  paths:
    description: Space-separated paths to commit.
    required: true
  token:
    description: >-
      Token to open the pull request with. GitHub fires no events for what
      GITHUB_TOKEN does, so the default opens a pull request none of main's
      required checks will ever run on. Pass a PAT or app token to get one that
      can merge.
    default: ${{ github.token }}

outputs:
  url:
    description: The pull request's URL, empty when one had already been opened.
    value: ${{ steps.open.outputs.url }}

runs:
  using: composite
  steps:
    - name: Open the pull request
      id: open
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        PATHS: ${{ inputs.paths }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        standing=$(gh pr list --head "$BRANCH" --state all --json number,state \
          --jq 'map(select(.state != "CLOSED")) | .[].number')
        if [ -n "$standing" ]; then
          echo "Already proposed: a pull request for $BRANCH is open or merged."
          exit 0
        fi

        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        git switch -c "$BRANCH"
        # Unquoted on purpose: the input is a list, not one path.
        # shellcheck disable=SC2086
        git add -- $PATHS
        git commit -m "$TITLE"
        # No open or merged pull request claims this branch, so anything left on it
        # is a proposal that was thrown away.
        git push --force --set-upstream origin "$BRANCH"

        printf '%s\n' "$BODY" > "${RUNNER_TEMP}/pr-body.md"
        url=$(gh pr create --title "$TITLE" --body-file "${RUNNER_TEMP}/pr-body.md")
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Opened $url"
