name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  types:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare

      - name: Check Types
        run: bun check:types

  codestyle:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare

      - name: Check JS Codestyle
        run: bun check:codestyle

  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare

      - name: Run Tests
        run: bun run test

      - name: Test NBD attachment
        env:
          NIBRUN_TEST_NBD: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y nbd-client nbdkit fuse3 openssl curl
          sudo modprobe nbd nbds_max=1
          bun run --filter @repo/agent test tests/lib/volumes/nbd-stock.test.ts

      - name: Test VM storage dependencies
        run: sudo env "PATH=$PATH" NIBRUN_TEST_VM_SYSTEMD=1 "$(command -v bun)" run --filter @repo/agent test tests/lib/vm/app-storage-unit-linux.test.ts

      - name: Test configured ZeroFS NBD persistence
        run: |
          sudo modprobe fuse
          sudo env "PATH=$PATH" NIBRUN_TEST_ZEROFS=1 "$(command -v bun)" run --filter @repo/agent test tests/lib/volumes/zerofs-persistence.test.ts

  checks-passed:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: checks:required
    needs: [types, codestyle, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed"
