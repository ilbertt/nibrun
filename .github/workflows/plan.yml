name: plan

# No paths filter: this is a required check, and a check gated by a path filter
# never reports on the PRs it skips, leaving them unmergeable. The script
# decides whether there is anything to plan.
on:
  pull_request:

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2

jobs:
  plan:
    name: plan:required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The script diffs against the base branch to decide whether to plan.
          fetch-depth: 0

      - uses: ./.github/actions/prepare

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Read-only, and a different role from the deploy: a pull request presents
      # a different OIDC subject than a push to main.
      - name: Configure AWS credentials (plan role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_api_hostname: ${{ vars.API_HOSTNAME }}
        run: bun run --filter @repo/internal-scripts terraform-plan
