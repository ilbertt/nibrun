name: infra

# No paths filter: infra-passed is a required check, and a check gated by a path
# filter never reports on the PRs it skips, leaving them unmergeable. The plan
# script decides for itself whether anything under infra/terraform changed.
on: pull_request

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Formatting and validity only — no credentials, no state.
      - name: Check Terraform
        run: bun run --filter @repo/internal-scripts terraform-check

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script diffs against the base branch to decide whether to plan.
          fetch-depth: 0

      - uses: ./.github/actions/prepare

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Read-only, and a different role from the deploy: a pull request presents
      # a different OIDC subject than a push to main.
      - name: Configure AWS credentials (Terraform plan role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_api_hostname: ${{ vars.API_HOSTNAME }}
          TF_VAR_dozzle_hostname: ${{ vars.DOZZLE_HOSTNAME }}
          TF_VAR_victorialogs_hostname: ${{ vars.VICTORIALOGS_HOSTNAME }}
          # Still APP_DOMAIN on purpose: the repository variable is read outside this repo
          # too, so it is not ours alone to rename.
          TF_VAR_app_host_domain: ${{ vars.APP_DOMAIN }}
          TF_VAR_api_github_client_id: ${{ vars.API_GITHUB_CLIENT_ID }}
          TF_VAR_api_github_client_secret: ${{ secrets.API_GITHUB_CLIENT_SECRET }}
          TF_VAR_caddy_tls_cert: ${{ vars.CADDY_TLS_CERT }}
          TF_VAR_caddy_tls_key: ${{ secrets.CADDY_TLS_KEY }}
          TF_VAR_app_host_caddy_tls_cert: ${{ vars.APP_HOST_CADDY_TLS_CERT }}
          TF_VAR_app_host_caddy_tls_key: ${{ secrets.APP_HOST_CADDY_TLS_KEY }}
        run: bun run --filter @repo/internal-scripts terraform-plan

  infra-passed:
    if: always()
    name: infra:required
    needs: [terraform-check, terraform-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All infra jobs passed"
