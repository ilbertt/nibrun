# Local stack: Postgres, MinIO, the API, and Dozzle. Copy .env.example to .env
# first.
#
# Anything truly opinionated (internal service URLs, container ports, bucket
# bootstrap) lives here, not in .env.

services:
  postgres-db:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${API_DB_USER}
      POSTGRES_PASSWORD: ${API_DB_PASSWORD}
      POSTGRES_DB: ${API_DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${API_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - nibrun

  minio:
    image: minio/minio:latest
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${API_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${API_S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${API_S3_PORT}:9000"
      - "127.0.0.1:${API_S3_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    networks:
      - nibrun

  minio-prepare:
    image: minio/mc:latest
    container_name: minio-prepare
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set nibrun http://minio:9000 "$$API_S3_ACCESS_KEY_ID" "$$API_S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "nibrun/$$ARTIFACTS_BUCKET"
    environment:
      - API_S3_ACCESS_KEY_ID
      - API_S3_SECRET_ACCESS_KEY
      - ARTIFACTS_BUCKET
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - nibrun

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nibrun-api:local
    container_name: api
    environment:
      - PORT=3000
      - BASE_URL=${API_BASE_URL}
      - DATABASE_URL=postgresql://${API_DB_USER}:${API_DB_PASSWORD}@postgres-db:5432/${API_DB_NAME}
      - BETTER_AUTH_SECRET=${API_BETTER_AUTH_SECRET}
      - GITHUB_CLIENT_ID=${API_GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${API_GITHUB_CLIENT_SECRET}
      - S3_ENDPOINT=http://minio:9000
      # Reads only. Writes arrive from the fleet through Caddy's ingest listener,
      # and the api is what decides who may see an app — so this is the one thing
      # on the compose network that queries the store, and nothing queries it
      # from outside.
      #
      # Not in .env: unlike S3, the log store runs in this stack in production
      # too, at the same name and port, so there is no deployment for this to
      # vary by.
      - VICTORIALOGS_ENDPOINT=http://victorialogs:9428
      - ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET}
      - AGENT_BOOTSTRAP_TOKEN=${AGENT_BOOTSTRAP_TOKEN}
      - S3_ACCESS_KEY_ID=${API_S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${API_S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${API_PORT}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "/busybox/wget",
          "-q",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
      minio-prepare:
        condition: service_completed_successfully
    networks:
      - nibrun

  # Where the fleet's logs land: tenant output and each app host's own journal,
  # pushed in over Caddy's log ingest listener. Nothing writes to it yet — the
  # shippers are a later change; this gives them somewhere to write.
  #
  # Chosen over Loki because the fields worth filtering on here are app, instance
  # and deployment ids. Loki indexes labels and punishes their cardinality, so
  # instance and deployment would have to become structured metadata; this treats
  # every field as indexed and high cardinality as the ordinary case.
  #
  # No healthcheck: the image is scratch, so there is no shell and no HTTP client
  # in the container to run one with. `/health` answers, but only from outside, so
  # the deploy gates on the container staying up instead.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    command:
      - -retentionPeriod=${VICTORIALOGS_RETENTION_PERIOD}
      - -storageDataPath=/victoria-logs-data
      # Overrides the journald default of `_HOSTNAME,_SYSTEMD_UNIT`, which would
      # be a stream per microVM on this fleet: `nibrun-vm@<instanceId>.service`
      # is one unit per instance, and instances are minted on every deploy. Host
      # and service are stable, so they key the stream; the unit stays an
      # ordinary indexed field and is no less filterable for it.
      - -journald.streamFields=_HOSTNAME,SOURCE
    volumes:
      - victorialogs-data:/victoria-logs-data
    # Loopback only, for the built-in UI at /select/vmui — same reasoning as
    # Dozzle below. Ingest arrives through Caddy, and the api queries over the
    # compose network; neither goes through here.
    ports:
      - "127.0.0.1:${VICTORIALOGS_PORT}:9428"
    restart: always
    networks:
      - nibrun

  # Every container's logs, read off the Docker socket, in local and prod alike.
  # Loopback-only and unauthenticated on purpose: reaching it on the box takes an
  # SSM port-forward, which already costs AWS credentials. The change that gives
  # it a public route is the change that has to give it DOZZLE_AUTH_PROVIDER.
  dozzle:
    image: amir20/dozzle:v10.6
    container_name: dozzle
    environment:
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      # `:ro` covers the socket file, not the Docker API behind it — Dozzle only
      # ever issues read calls, but nothing here is what stops it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_PORT}:8080"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nibrun

networks:
  nibrun:

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  victorialogs-data:
    driver: local
