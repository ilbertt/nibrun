# Production override, applied on top of docker-compose.yml on the box:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# Differences from local:
#   - The api runs a released image instead of a local build.
#   - Object storage is real S3, so MinIO does not run.
#   - Postgres is bind-backed by the persistent disk mounted at /data, so it
#     survives instance replacement.
#   - A backup sidecar streams a nightly dump off the box.
#   - Cloudflare Tunnel reaches Caddy over Docker networking; local talks to the api directly.

services:
  umami:
    environment:
      - CLIENT_IP_HEADER=CF-Connecting-IP

  api:
    build: !reset null
    image: ${API_IMAGE_URI}
    environment:
      - S3_ENDPOINT=${API_S3_ENDPOINT}
    # Replaced, not merged: the local stack waits for minio-prepare, which does
    # not run here.
    depends_on: !override
      postgres-db:
        condition: service_healthy

  # Cloudflared reaches Caddy over Docker networking. Only the fleet's private
  # control and log listeners are published on the host.
  #
  # No depends_on: it makes compose restart Caddy whenever an upstream is
  # recreated, which every deploy does to the api, taking the edge down for the
  # upstream's health-gate window. The Caddyfile's lb_try_duration already rides
  # out an upstream that is not accepting yet, on cold boot and during a
  # recreate.
  #
  # Reload configuration through the mounted directory instead of recreating
  # the edge on each deploy. Mounting the directory rather than individual files
  # lets replacements become visible without the container retaining old inodes.
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: always
    ports:
      # The security group admits only the fleet's control and log sources.
      - "${INTERNAL_PORT}:${INTERNAL_PORT}"
      - "${LOG_INGEST_PORT}:${LOG_INGEST_PORT}"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - API_HOSTNAME
      - DOZZLE_HOSTNAME
      - VICTORIALOGS_HOSTNAME
      - UMAMI_HOSTNAME
      - INTERNAL_PORT
      # Without this the Caddyfile's `:{$LOG_INGEST_PORT}` site address expands
      # to a bare `:`, which Caddy drops silently rather than refusing — the
      # listener simply does not exist and every shipper on the fleet gets a
      # connection refused.
      - LOG_INGEST_PORT
    volumes:
      - ./caddy:/etc/caddy:ro
    networks:
      - nibrun

  # The named Tunnel reaches Caddy without publishing a public host port.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    container_name: cloudflared
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["tunnel", "--metrics", "127.0.0.1:2000", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN:?}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nibrun

  # Host port-forwards must not bypass the Tunnel's Access validation.
  victorialogs:
    ports: !reset []

  dozzle:
    ports: !reset []
    environment:
      - DOZZLE_AUTH_PROVIDER=none
    # Preserve UI preferences across container recreations.
    volumes:
      - ./dozzle/data:/data

  # Loopback only here as in local, so this login is not what stands between a
  # SQL console and the internet — the absence of any route to it is. It exists
  # because the session behind it is the cluster superuser's, and a port
  # published by mistake should not be the last thing that mattered.
  #
  # pgweb compares credentials directly, so there is nothing on the box to hash.
  # An unguessable username costs an admin nothing beyond looking up the password;
  # both credentials are SSM parameters read into .env by on_box_deploy.sh.
  pgweb:
    environment:
      - PGWEB_AUTH_USER=${PGWEB_AUTH_USER}
      - PGWEB_AUTH_PASS=${PGWEB_AUTH_PASS}

  # Both exist only to stand in for S3 locally. An inactive profile is how a
  # service gets switched off from an override file.
  minio:
    profiles: [local]
  minio-prepare:
    profiles: [local]

  # Needs the instance role to reach S3, which is why it is prod-only. AWS
  # credentials come from IMDS, which the instance allows two hops for so
  # containers can read it.
  pg-backup:
    image: ${PG_BACKUP_IMAGE_URI}
    container_name: pg-backup
    environment:
      # pg_dumpall dumps the whole cluster, roles included, so this has to be
      # the superuser — which the api's role is, since it owns the database.
      PGHOST: postgres-db
      PGUSER: ${API_DB_USER}
      PGPASSWORD: ${API_DB_PASSWORD}
      PGDATABASE: ${API_DB_NAME}
      PG_BACKUP_BUCKET: ${PG_BACKUP_BUCKET}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    networks:
      - nibrun

volumes:
  umami-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/umami-data

  postgres-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/postgres-data

  # On the persistent volume rather than in a container-local one, so a retention
  # period outlives instance replacement. It rides the DLM snapshots the volume
  # already carries (dlm.tf) and stays out of pg-backup's nightly dump, which
  # dumps the whole cluster and would otherwise grow with log volume.
  victorialogs-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/victorialogs-data
