# Production override, applied on top of docker-compose.yml on the box:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# Differences from local:
#   - The api runs a released image instead of a local build.
#   - Object storage is real S3, so MinIO does not run.
#   - Postgres is bind-backed by the persistent disk mounted at /data, so it
#     survives instance replacement.
#   - A backup sidecar streams a nightly dump off the box.
#   - Caddy fronts the api and terminates TLS; local talks to the api directly.

services:
  api:
    build: !reset null
    image: ${API_IMAGE_URI}
    environment:
      - S3_ENDPOINT=${API_S3_ENDPOINT}
    # Replaced, not merged: the local stack waits for minio-prepare, which does
    # not run here.
    depends_on: !override
      postgres-db:
        condition: service_healthy

  # The public edge, and the only container publishing a port off loopback. It
  # terminates the Cloudflare-to-origin TLS leg; the api keeps its own loopback
  # binding and its address on the compose network, and neither goes through
  # here. Only 443: the zone is Full (strict), so Cloudflare never reaches the
  # origin over 80, and there is no ACME challenge to answer.
  #
  # No depends_on: it makes compose restart Caddy whenever an upstream is
  # recreated, which every deploy does to the api, taking the edge down for the
  # upstream's health-gate window. The Caddyfile's lb_try_duration already rides
  # out an api that is not accepting yet, on cold boot and during a recreate.
  #
  # Nothing here changes between deploys, so the container is left running and
  # the edge never blinks; new config and re-issued certificates arrive through
  # the reload in on_box_deploy.sh rather than a recreate. The whole directory
  # is mounted, not the files in it, so replacing a file cannot leave the
  # container holding the old inode.
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: always
    ports:
      - "443:443"
      # Admitted from the app hosts' security group only; see infra/caddy/Caddyfile.
      # On every interface like 443 above: the security group is the boundary, and
      # AWS enforces it before a packet reaches the instance.
      - "${INTERNAL_PORT}:${INTERNAL_PORT}"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - API_HOSTNAME
      - DOZZLE_HOSTNAME
      - INTERNAL_PORT
    volumes:
      - ./caddy:/etc/caddy:ro
    networks:
      - nibrun

  # Local reaches Dozzle over loopback and needs no login; here it is behind a
  # public hostname, so it grows one. Simple auth over forward-proxy because the
  # edge has no identity to forward — Authenticated Origin Pulls proves the
  # request came from Cloudflare, not who is making it.
  #
  # The user list is built into dozzle/data by on_box_deploy.sh, which hashes
  # the password it reads from SSM. Mounting the directory rather than the file
  # means the deploy can replace the file without the container holding the old
  # inode.
  dozzle:
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    volumes:
      - ./dozzle/data:/data

  # Both exist only to stand in for S3 locally. An inactive profile is how a
  # service gets switched off from an override file.
  minio:
    profiles: [local]
  minio-prepare:
    profiles: [local]

  # Needs the instance role to reach S3, which is why it is prod-only. AWS
  # credentials come from IMDS, which the instance allows two hops for so
  # containers can read it.
  pg-backup:
    image: ${PG_BACKUP_IMAGE_URI}
    container_name: pg-backup
    environment:
      # pg_dumpall dumps the whole cluster, roles included, so this has to be
      # the superuser — which the api's role is, since it owns the database.
      PGHOST: postgres-db
      PGUSER: ${API_DB_USER}
      PGPASSWORD: ${API_DB_PASSWORD}
      PGDATABASE: ${API_DB_NAME}
      PG_BACKUP_BUCKET: ${PG_BACKUP_BUCKET}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    networks:
      - nibrun

volumes:
  postgres-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/postgres-data

  # On the persistent volume rather than in a container-local one, so a retention
  # period outlives instance replacement. It rides the DLM snapshots the volume
  # already carries (dlm.tf) and stays out of pg-backup's nightly dump, which
  # dumps the whole cluster and would otherwise grow with log volume.
  victorialogs-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/victorialogs-data
