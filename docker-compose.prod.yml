# Production override, applied on top of docker-compose.yml on the box:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
#
# Differences from local:
#   - The api runs a released image instead of a local build.
#   - Object storage is real S3, so MinIO does not run.
#   - Postgres is bind-backed by the persistent disk mounted at /data, so it
#     survives instance replacement.
#   - A backup sidecar streams a nightly dump off the box.
#   - Caddy fronts the api and terminates TLS; local talks to the api directly.

services:
  api:
    build: !reset null
    image: ${API_IMAGE_URI}
    environment:
      - S3_ENDPOINT=${API_S3_ENDPOINT}
    # Replaced, not merged: the local stack waits for minio-prepare, which does
    # not run here.
    depends_on: !override
      postgres-db:
        condition: service_healthy

  # The public edge, and the only container publishing a port off loopback. It
  # terminates the Cloudflare-to-origin TLS leg; the api keeps its own loopback
  # binding and its address on the compose network, and neither goes through
  # here. Deliberately no depends_on either: the Caddyfile's retry window exists
  # so the edge outlives an api being replaced, and tying this container's
  # lifecycle to that service would work against it.
  #
  # Nothing here changes between deploys, so compose leaves the container
  # running and the edge never blinks. New config and rotated certificates
  # arrive through the reload in on_box_deploy.sh instead of a recreate.
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    environment:
      - API_HOSTNAME=${API_HOSTNAME}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./cloudflare-origin-pull-ca.pem:/etc/caddy/cloudflare-origin-pull-ca.pem:ro
      - ./tls:/etc/caddy/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2020/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - nibrun

  # Both exist only to stand in for S3 locally. An inactive profile is how a
  # service gets switched off from an override file.
  minio:
    profiles: [local]
  minio-prepare:
    profiles: [local]

  # Needs the instance role to reach S3, which is why it is prod-only. AWS
  # credentials come from IMDS, which the instance allows two hops for so
  # containers can read it.
  pg-backup:
    image: ${PG_BACKUP_IMAGE_URI}
    container_name: pg-backup
    environment:
      # pg_dumpall dumps the whole cluster, roles included, so this has to be
      # the superuser — which the api's role is, since it owns the database.
      PGHOST: postgres-db
      PGUSER: ${API_DB_USER}
      PGPASSWORD: ${API_DB_PASSWORD}
      PGDATABASE: ${API_DB_NAME}
      PG_BACKUP_BUCKET: ${PG_BACKUP_BUCKET}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always
    networks:
      - nibrun

volumes:
  postgres-data:
    driver_opts:
      type: none
      o: bind
      device: /data/volumes/postgres-data
